[project]
name = "fenwick-opencode"
version = "0.1.0"
description = "Fenwick Cloud Engineering Support Queue"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "python-docx>=1.1",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "python-docx>=1.1",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
asyncio_mode = "auto"